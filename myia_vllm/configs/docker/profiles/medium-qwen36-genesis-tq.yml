# Docker Compose profile — Qwen3.6-35B-A3B-AWQ + TurboQuant k8v4 via Genesis patch tree
# ============================================================================
# STATUS: PREPARED 2026-05-14, NOT YET BUILT OR DEPLOYED. Step 1 of the
#         TurboQuant migration (Option B). Inert until explicitly built/deployed.
#
# WHAT THIS IS
#   The 2026-05-06 attempt at Qwen3.6-35B-A3B MoE + TurboQuant k8v4 booted with
#   1.49M-token KV (x4.6 vs FP8 322K) but crashed on the first ~30K-prefix
#   chunked-prefill continuation: AssertionError at
#   turboquant_attn.py:720:_continuation_prefill. Upstream fix PR #40798 is
#   OPEN + BLOCKED. This profile takes Option B instead: the
#   Sandermage/genesis-vllm-patches downstream tree, whose P22/P38-class patches
#   fix exactly that crash (externally confirmed in vllm#41726 by `xyehya`).
#
# SCOPE: TurboQuant ONLY. No spec-decode. DFlash is step 2 (separate A/B) — see
#        MEMORY.md project_turboquant_hybrid_status.md.
#
# ----------------------------------------------------------------------------
# RUNBOOK
# ----------------------------------------------------------------------------
#   1. BUILD (does NOT touch prod — independent docker build):
#        docker build -f myia_vllm/configs/docker/Dockerfile.qwen36-genesis-tq \
#                     -t vllm-qwen36-genesis-tq:v7.72.5-vllm01d4d1ad3 \
#                     myia_vllm/configs/docker/
#
#   2. A/B DEPLOY (takes prod down — only when claudish validation is done):
#        docker compose -f myia_vllm/configs/docker/profiles/medium-qwen36-moe.yml --env-file myia_vllm/.env down
#        docker compose -f myia_vllm/configs/docker/profiles/medium-qwen36-genesis-tq.yml --env-file myia_vllm/.env up -d
#        docker logs -f myia_vllm-medium-qwen36-moe   # same container_name
#
#   3. VALIDATE — the gate is the failure mode that warmup misses:
#        a. Boot clean. Check logs for the Genesis structured boot summary and
#           "GPU KV cache size" (expect ~1.5M tokens vs FP8 322K).
#        b. Smoke: chat, thinking, tool calling (qwen3_coder XML).
#        c. CRASH TEST: replay ~30K-token-prefix prompts (real OWUI traffic
#           class) — this is what crashed 2026-05-06. Must NOT raise the
#           _continuation_prefill assertion.
#        d. Needle recall at ~254K context.
#        e. Leak check: VRAM steady after 100 requests.
#        f. Decode tok/s + concurrent slot count vs FP8 baseline.
#
#   4. ROLLBACK (instant — baseline image is retained, nothing was deleted):
#        docker compose -f myia_vllm/configs/docker/profiles/medium-qwen36-genesis-tq.yml --env-file myia_vllm/.env down
#        docker compose -f myia_vllm/configs/docker/profiles/medium-qwen36-moe.yml --env-file myia_vllm/.env up -d
#
# ----------------------------------------------------------------------------
# BUILD VERIFICATION — done 2026-05-16, image vllm-qwen36-genesis-tq:v7.72.5-vllm01d4d1ad3
# ----------------------------------------------------------------------------
#   ✅ Genesis package imports cleanly (reports v7.63.x; the `__version__`
#      constant is stale relative to SHA fbecee31 — Sandermage doesn't bump
#      it per tag, the SHA is the source of truth).
#   ✅ `genesis_v7` entry point registered in `vllm.general_plugins`.
#   ✅ vLLM pin gate allowlist contains our pin `0.20.2rc1.dev9+g01d4d1ad3`.
#   ✅ shm_broadcast patch (vllm#35104 carry-forward) verifies on the
#      01d4d1ad3 nightly — `_memory_barrier` callable, SHM PATCH VERIFIED
#      at build time. Reservation #2 cleared.
#   ✅ All 6 GENESIS_ENABLE_P* flags below exist verbatim as opt-in env vars
#      in /opt/genesis/vllm/_genesis (grep-confirmed). Reservation #1 cleared.
#   ℹ️  P22 (TurboQuant shared dequant prealloc) and P38 (workspace fix that
#      resolves the 2026-05-06 _continuation_prefill crash, per xyehya in
#      vllm#41726) are AUTO-APPLIED on NVIDIA — no flag needed. Our opt-ins
#      are TQ-perf extras (P67 multi-query kernel, P98/P101 dispatch
#      routing, P78 tolist guard from noonghunna), the compile-safe P38B
#      variant, and P37.
#
# BATCH SIZING — 4096 / 16. The 8192 unlock was REVERTED 2026-06-24 after a crash.
#   * 2026-06-24 ATTEMPT (REVERTED): set --max-num-batched-tokens 8192 with Genesis
#     P72 (profile_run M cap = 4096) + P74 (chunk-clamp). Boot was clean and a short
#     bench passed (80K single-prefill crash test, N=16 decode) — but those NEVER
#     produce a single forward batch in (4096, 8192]: the 80K prefill is P74-chunked
#     to <=4096, and N=16 decode is ~16 tokens/step. Under real mixed traffic
#     (claudish long context + condensation + decode) a combined forward batch of
#     5536 tokens hit a GDN buffer sized for 4096 and the worker died:
#         RuntimeError: setStorage: sizes [5536, 16, 128] ... requiring a storage
#         size of 22675456 are out of bounds for storage of size 16777216
#         (16777216 = 4096*16*128*2 ; 22675456 = 5536*16*128*2)
#     at qwen3_next.py:495 via the inductor/cuda-graph as_strided aliasing path,
#     ~1h25 after deploy (2026-06-24 15:23:56Z). The condensation outage that
#     followed was THIS crash. This is itself an instance of verify-before-propagating:
#     "8192 validated" was declared from a bench that could not trigger the failure.
#   * ROOT CAUSE: P72 caps the profiled/compiled shape at GENESIS_PROFILE_RUN_CAP_M
#     (4096), so the qwen3_next (GatedDeltaNet) compiled buffers are 4096-sized.
#     P72 lets the engine BOOT at batch 8192, but the GDN buffer stays coupled to
#     the 4096 profile cap, so any runtime forward >4096 tokens overflows it. The
#     runtime batch is therefore bounded by GENESIS_PROFILE_RUN_CAP_M, NOT by
#     --max-num-batched-tokens. 4096 IS the effective ceiling unless the profile cap
#     AND a fresh compile are BOTH raised to 8192 — which risks re-triggering the
#     2026-05-24 boot crash below and is UNTESTED. Do not retry on prod.
#   * 2026-05-24 ramp 4096→32768 / 16→64 CRASHED at boot (the reason P72 exists):
#     torch.compile/Dynamo fake-tensor mismatch at determine_available_memory():
#         mul(FakeTensor(65536,128), FakeTensor(16*s59,128))  [65536 = 2*batched-tokens]
#     The TQ k8v4 GQA/multi-query kernel (P40 vllm#40792 / P67) cannot specialize
#     that shape at large batch. Same signature as DFlash Attempt 2.
#   * NET: 4096 is the proven-stable runtime batch (7-day soak + this revert).
#     Watchdog flapping is NOT fixable by ramping batch — tune the watchdog.
#   * VISION: kept ON (--dtype auto + --limit-mm-per-prompt, prod parity). Genesis'
#     own integration test ran --language-model-only --dtype float16. If boot or
#     TQ stability issues appear, that is the genesis-validated fallback to try.
# ============================================================================

services:
  vllm-medium-qwen36-moe:  # SAME container_name as baseline — only one runs at a time
    image: vllm-qwen36-genesis-tq:v7.72.5-vllm01d4d1ad3
    container_name: myia_vllm-medium-qwen36-moe
    # gpu-memory-utilization 0.82→0.78 (2026-07-14) →0.70 (2026-08-04). GPU 0 is shared with the
    # Windows desktop (explorer/VSCode/Edge, fluctuating baseline); GPU 1 is not. Boot-time
    # CUDA-OOM crash-loops at _allocate_kv_cache_tensors hit on 2026-07-13 (0.82, RestartCount
    # 53→59+), then AGAIN at 0.78 on 07-28 and 08-01 (686 MiB alloc failing with 2.66 GiB "free"
    # = pool-cap, not physical exhaustion). 0.78 moved the failure point by only ~0.2 GiB.
    # WHY: vLLM's real footprint is ~21.9 GiB/GPU, i.e. ~2.7 GiB ABOVE the nominal 0.78×24564
    # budget — Marlin-MoE variable temp allocs (RFC #27951) and the Genesis prealloc pools
    # (P28 GDN / P37 MoE / TQ-dequant) live OUTSIDE the gpu-util pool. So the effective margin
    # on the desktop-shared GPU 0 was <1 GiB, which also caused WDDM paging slowdowns that mimic
    # a decode wedge. 0.70 (nominal 17,195 MiB → ~19.9 GiB real) restores ~2.7 GiB of headroom.
    # Cost: KV cache 1,736,379 → ~1.34M tokens — still ~5x the 262K max-model-len, and prod runs
    # at 5-7% KV occupancy. See MEMORY.md project_engine_wedge.md (3rd failure mode).
    command: >
      --host 0.0.0.0
      --port ${VLLM_PORT_GLM:-5002}
      --model ${VLLM_MODEL_QWEN36_MOE:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}
      --served-model-name qwen3.6-35b-a3b
      --api-key ${VLLM_API_KEY_MEDIUM}

      --tensor-parallel-size 2
      --enable-expert-parallel
      --gdn-prefill-backend triton
      --no-enable-flashinfer-autotune
      --gpu-memory-utilization 0.70
      --max-model-len 262144
      --kv-cache-dtype turboquant_k8v4
      --dtype auto
      --limit-mm-per-prompt '{"image":4,"video":0}'
      --mm-processor-kwargs '{"max_pixels":774000}'
      --skip-mm-profiling
      --max-num-batched-tokens 4096
      --max-num-seqs 16
      --performance-mode interactivity
      --enable-chunked-prefill
      --enable-prefix-caching
      --prefix-caching-hash-algo xxhash
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --distributed-executor-backend mp
      --disable-custom-all-reduce
      --async-scheduling
      --no-scheduler-reserve-full-isl

      --default-chat-template-kwargs '{"preserve_thinking":true}'
      --override-generation-config '{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.0}'
      --middleware error_source_capture.ErrorSourceCapture
    ipc: host
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0,1
      - CUDA_VISIBLE_DEVICES=0,1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_USE_DEEP_GEMM=0
      - OMP_NUM_THREADS=1
      - VLLM_USE_FLASHINFER_MOE_FP16=1
      - VLLM_LOG_DIR=/logs
      - PYTHONPATH=/middleware  # for error_source_capture (opt-in via --middleware flag)
      # Oversize-request guard DISABLED 2026-06-24 (=0). The 512 KB HTTP 413 reject
      # turned slow z.ai->qwen fallback overflow into hard-fails -> cascade outage.
      # Real lever is the claudish-side concurrency cap (no-fallback routing), NOT
      # body size. Middleware stays on for logging. Set >0 to re-enable if needed.
      - VLLM_MAX_REQUEST_BODY_BYTES=0
      # ── Genesis runtime env (from integration-awq.yml PROD-MIRROR block) ──
      # These matter for TurboQuant memory accounting — the profiler must size
      # the KV pool correctly around the TQ dequant/continuation transient peaks.
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - NCCL_P2P_DISABLE=1
      - VLLM_USE_FLASHINFER_SAMPLER=0  # v2g: was =1 in v2f, suspected idle-deadlock vector (FlashInfer sampler autotune dlopens .so → CPython _thread.lock corruption)
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_MARLIN_MOE_BLOCK_SIZE_M=8
      - VLLM_MOE_USE_DEEP_GEMM=0
      - VLLM_USE_FLASHINFER_MOE_FP8=0
      # ── Genesis patch flags — FIRST DRAFT, VERIFY against docs/PATCHES.md ──
      # P37 — shared MoE intermediate-cache pool (integration-awq.yml sets this).
      # P38/P38B — persistent K_full/V_full continuation-prefill workspace +
      #            compile-safe variant. This is the crash-fix family.
      # P67 — TurboQuant multi-query Triton kernel (docs: TQ k8v4 requires it).
      # P98 — TurboQuant WorkspaceManager revert (Ampere/Ada small-batch perf).
      # P101 — TurboQuant continuation 64-token slicing (long-prefix OOM guard).
      # P78 — TurboQuant .tolist() cudagraph-capture guard.
      - GENESIS_ENABLE_P37=1
      - GENESIS_ENABLE_P38B_COMPILE_SAFE=1
      - GENESIS_ENABLE_P67_TQ_MULTI_QUERY_KERNEL=1
      - GENESIS_ENABLE_P98=1
      - GENESIS_ENABLE_P101=1
      - GENESIS_ENABLE_P78_TOLIST_CAPTURE_GUARD=1
      # P40 — Genesis dispatcher recommended for RTX 4090 (SM 128, L2 72 MB, mixed regime).
      # TQ k8v4 GQA grouping kernel from vllm#40792. Author measured +27% on H100;
      # +5-15% expected on Ada. Cache-locality benefit needs L2 >= 24 MB (we have 72).
      - GENESIS_ENABLE_P40=1
      # P72/P74 batch-8192 unlock REVERTED 2026-06-24 (see BATCH SIZING banner).
      # batch 8192 + P72 profile-cap M=4096 caused a runtime setStorage overflow
      # crash in qwen3_next.py at 15:23:56Z (GDN buffer sized for 4096, a runtime
      # forward of 5536 tokens overflowed it). P72 sized the compiled buffers to the
      # cap, so the runtime batch is bounded by the cap — not by max-num-batched-tokens.
      # Runtime batch is back to the proven 4096. Do not re-add P72+8192 on prod.
      - GENESIS_VLLM_PIN_POLICY=strict
    volumes:
      - ${VLLM_MODELS_PATH:-./models}:/models:ro
      - ${HF_CACHE_PATH:-~/.cache/huggingface}:/root/.cache/huggingface
      - vllm-compile-cache-qwen36-genesis-tq:/root/.cache/vllm  # separate cache: different vLLM pin + Genesis rebinds
      - ${VLLM_LOG_PATH:-./../../../logs}:/logs
      - ./../../../middleware:/middleware:ro  # error_source_capture diag
    ports:
      - "${VLLM_PORT_GLM:-5002}:${VLLM_PORT_GLM:-5002}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT_GLM:-5002}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s  # 15 min: model load + Genesis apply_all + TQ + CUDA graph capture (cold)
    restart: unless-stopped

  # Watchdog sidecar — identical to medium-qwen36-moe.yml (keepalive + port-fwd
  # monitor + auto-restart). Pings host.docker.internal to catch Docker Desktop
  # port-forwarding loss; falls back to internal DNS to catch engine crashes.
  watchdog-qwen36-moe:
    image: docker:cli
    container_name: myia_vllm-watchdog-qwen36-moe
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1

        CONTAINER="myia_vllm-medium-qwen36-moe"
        PORT="$${VLLM_PORT_GLM:-5002}"
        # Watchdog v3 (2026-07-03) — FAST, boot-safe, wedge- AND hard-hang-aware.
        # Prior design (INTERVAL 120, MAX_FAIL 5, two 60s POST probes/cycle) took
        # ~15-20 MIN to restart a wedge -> the whole cluster's condensation died
        # that long each time (roosync_dashboard 180s timeouts, DM fallbacks).
        # It also could not tell "booting" (health down, must wait) from
        # "API up but decode stuck" (the wedge, must restart NOW).
        #
        # v2 splits those two failure modes on a cheap GET /health FIRST:
        #   health==200 -> API server alive (NOT booting). Run the decisive test:
        #                  a real 24-token decode. Two consecutive timeouts while
        #                  health is 200 = confirmed WEDGE -> restart in ~2 min.
        #                  (A healthy engine finishes 24 tokens in ~1s even at N=16
        #                  saturation — decode is continuously batched — so a 40s
        #                  timeout twice is genuinely stuck, not just busy.)
        #   health!=200 -> booting OR hung. v3 asks Docker's OWN healthcheck to tell
        #                  them apart (start_period=900s):
        #                    docker=starting  -> in the 15-min boot grace -> NEVER
        #                       restart (fixes v2's latent hole: DOWN_MAX=12min < 15min
        #                       start_period could restart a slow cold boot).
        #                    docker=unhealthy -> past grace AND 5 healthchecks failed =
        #                       definitively broken, NOT booting -> restart in ~2 min
        #                       (UNHEALTHY_MAX). Cuts a hard-hang outage 12min -> ~2min.
        #                    docker=<other>   -> blind DOWN_MAX backstop (~12 min).
        #                  The 2026-07-03 ~12:57Z hard-hang (health=000, no traceback,
        #                  silent engine-loop freeze) is exactly the unhealthy case.
        INTERVAL=30
        HEALTH_TIMEOUT=5
        GEN_TIMEOUT=40
        PROBE_MAX_TOKENS=24
        WEDGE_MAX=2       # health 200 + decode stuck: restart after ~2 min
        UNHEALTHY_MAX=4   # v3: docker=unhealthy (post-boot, definitively broken): ~2 min fast-path
        DOWN_MAX=24       # health down, docker status unknown: ~12 min blind backstop
        WEDGE_FAIL=0
        DOWN_FAIL=0
        # v4 (2026-07-14): boot-OOM crash-loop detection. A crash-looping container
        # re-enters docker=starting on EVERY restart, so the 'starting' branch below
        # (never-restart, boot-safe) hid the 2026-07-13 CUDA-OOM crash-loop entirely
        # (RestartCount 53->59+, watchdog silent). Track RestartCount churn WHILE
        # docker=starting: a patient cold boot keeps RestartCount flat, a crash-loop
        # makes it climb. A docker restart is FUTILE here (it is already restarting),
        # so we emit a loud, greppable CRASH-LOOP line instead of the misleading BOOTING.
        STARTING_MAX=3   # 3 restart-increments while stuck in 'starting' = crash-loop (~6 min), not a boot
        PREV_RC=-1
        STARTING_CHURN=0

        echo "Watchdog v4 (wedge + hard-hang + boot-crash-loop detection) for Qwen3.6-35B-A3B + Genesis TurboQuant"
        echo "  WEDGE   (health 200 + 24-tok decode >$${GEN_TIMEOUT}s): restart after $$WEDGE_MAX fails (~2 min)"
        echo "  HUNG    (docker=unhealthy, post-boot):                restart after $$UNHEALTHY_MAX fails (~2 min)"
        echo "  BOOTING (docker=starting):                            never restart (15-min grace)"
        echo "  DOWN    (health != 200, docker status unknown):       restart after $$DOWN_MAX fails (~12 min backstop)"
        echo "  CRASHLOOP(docker=starting + RestartCount churning):   flagged loud after $$STARTING_MAX (~6 min), NO futile restart (v4)"
        echo "  Interval: $${INTERVAL}s. Probes host.docker.internal (also catches port-fwd loss)."

        while true; do
          TS=$$(date '+%Y-%m-%d %H:%M:%S')

          # 1. Cheap liveness: is the API answering on the host-forwarded port?
          #    (/health is unauthenticated and served by the HTTP layer, which
          #     stays up during a wedge — the wedge is in the GENERATION path.)
          H=$$(curl -s -o /dev/null -w "%{http_code}" --max-time $$HEALTH_TIMEOUT \
            "http://host.docker.internal:$$PORT/health" 2>/dev/null)

          if [ "$$H" = "200" ]; then
            # API up (not booting). Decisive test: a REAL sustained decode.
            G=$$(curl -s -o /dev/null -w "%{http_code}" --max-time $$GEN_TIMEOUT \
              -X POST "http://host.docker.internal:$$PORT/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $${VLLM_API_KEY_MEDIUM}" \
              -d '{"model":"qwen3.6-35b-a3b","messages":[{"role":"user","content":"Count to twenty."}],"max_tokens":'$$PROBE_MAX_TOKENS',"temperature":0,"chat_template_kwargs":{"enable_thinking":false}}' 2>/dev/null)
            DOWN_FAIL=0
            STARTING_CHURN=0; PREV_RC=-1   # v4: serving /health => not crash-looping, clear churn state
            if [ "$$G" = "200" ]; then
              if [ $$WEDGE_FAIL -gt 0 ]; then
                echo "$$TS RECOVERED (decode ok after $$WEDGE_FAIL wedge fails)"
              else
                echo "$$TS OK health=200 decode=200"
              fi
              WEDGE_FAIL=0
            else
              WEDGE_FAIL=$$((WEDGE_FAIL + 1))
              echo "$$TS WEDGE health=200 decode=$$G (24 tok >$${GEN_TIMEOUT}s) (fail $$WEDGE_FAIL/$$WEDGE_MAX)"
              if [ $$WEDGE_FAIL -ge $$WEDGE_MAX ]; then
                echo "$$TS RESTARTING $$CONTAINER (WEDGE: API up but decode stuck)"
                docker restart $$CONTAINER
                WEDGE_FAIL=0
                echo "$$TS Restart issued. Waiting 600s for boot..."
                sleep 600
                continue
              fi
            fi
          else
            # Host /health not 200. Ask Docker's OWN healthcheck to tell booting from
            # broken (start_period=900s makes this signal boot-safe):
            HS=$$(docker inspect --format '{{.State.Health.Status}}' $$CONTAINER 2>/dev/null)
            WEDGE_FAIL=0
            if [ "$$HS" = "starting" ]; then
              # Within the 15-min boot grace — a cold TQ+GDN boot legitimately fails
              # /health here. NEVER restart (this is the fix for v2's 12min<15min hole).
              # v4: BUT a boot-OOM crash-loop ALSO lives in 'starting' (each crash resets
              # docker health to starting), so tell the two apart by RestartCount churn.
              DOWN_FAIL=0
              RC=$$(docker inspect --format '{{.RestartCount}}' $$CONTAINER 2>/dev/null)
              RC=$${RC:-0}
              if [ "$$PREV_RC" -ge 0 ] && [ "$$RC" -gt "$$PREV_RC" ]; then
                STARTING_CHURN=$$((STARTING_CHURN + 1))
              fi
              PREV_RC=$$RC
              if [ $$STARTING_CHURN -ge $$STARTING_MAX ]; then
                echo "$$TS CRASH-LOOP $$CONTAINER docker=starting but RestartCount churning (=$$RC, +$$STARTING_CHURN) — boot-time crash (likely CUDA-OOM at KV alloc, see project_engine_wedge 3rd mode). docker restart is FUTILE (already restarting); NOT auto-restarting. Fix externally: lower --gpu-memory-utilization or free GPU-0 desktop VRAM."
              else
                echo "$$TS BOOTING health=$$H (docker=starting, within 15-min grace — patient; RestartCount=$$RC)"
              fi
              sleep $$INTERVAL
              continue
            fi
            # Not booting. Distinguish port-fwd loss from a hung/down engine.
            HI=$$(curl -s -o /dev/null -w "%{http_code}" --max-time $$HEALTH_TIMEOUT \
              "http://vllm-medium-qwen36-moe:$$PORT/health" 2>/dev/null)
            DOWN_FAIL=$$((DOWN_FAIL + 1))
            if [ "$$HI" = "200" ]; then
              THRESH=$$DOWN_MAX  # engine fine internally; port-fwd hiccup may self-heal — stay patient
              echo "$$TS PORT-FWD-LOSS host=$$H internal=200 docker=$$HS (fail $$DOWN_FAIL/$$THRESH)"
            elif [ "$$HS" = "unhealthy" ]; then
              THRESH=$$UNHEALTHY_MAX  # docker's 5 checks failed post-grace = definitively broken
              echo "$$TS ENGINE-HUNG host=$$H internal=$$HI docker=unhealthy (fail $$DOWN_FAIL/$$THRESH, ~2min fast-path)"
            else
              THRESH=$$DOWN_MAX  # docker status unknown/transient — blind backstop
              echo "$$TS ENGINE-DOWN host=$$H internal=$$HI docker=$$HS (fail $$DOWN_FAIL/$$THRESH)"
            fi
            if [ $$DOWN_FAIL -ge $$THRESH ]; then
              echo "$$TS RESTARTING $$CONTAINER (unresponsive $$DOWN_FAIL cycles, docker=$$HS)"
              docker restart $$CONTAINER
              DOWN_FAIL=0
              echo "$$TS Restart issued. Waiting 600s for boot..."
              sleep 600
              continue
            fi
          fi

          sleep $$INTERVAL
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VLLM_API_KEY_MEDIUM=${VLLM_API_KEY_MEDIUM}
      - VLLM_PORT_GLM=${VLLM_PORT_GLM:-5002}
    depends_on:
      vllm-medium-qwen36-moe:
        condition: service_healthy
    restart: unless-stopped

  # Wedge-telemetry sidecar (2026-07-03) — passive, READ-ONLY sampler of the
  # engine's /metrics. Appends one JSONL line per interval (gen_rate, prompt_rate,
  # running, waiting, kv_pct + wedge flag) to _iteration_log/wedge_telemetry.jsonl
  # so the NEXT wedge onset (see MEMORY.md project-engine-wedge) leaves a
  # diagnostic trace and the load-correlation hypothesis gets tested on real
  # numbers (does `running` spike? does a big `prompt_rate` prefill land just
  # before? is KV low as the signature predicts?). NO GPU access: the decisive
  # signal — gen_rate<1 WHILE running>0 — comes from /metrics alone; GPU
  # power/util (an unreliable standalone tell — it also fires on healthy prefill
  # bursts) is captured host-side by the cron ops check. /metrics is
  # unauthenticated (the same endpoint the watchdog already polls) → no API key
  # is used or logged. Touches no prod config, the model, GPUs, or throughput.
  wedge-telemetry:
    image: python:3-slim
    container_name: myia_vllm-wedge-telemetry
    command: ["python", "/app/wedge_telemetry.py", "--interval", "60", "--out", "/out/wedge_telemetry.jsonl"]
    environment:
      - WEDGE_METRICS_URL=http://vllm-medium-qwen36-moe:${VLLM_PORT_GLM:-5002}/metrics
    volumes:
      - ./../../../scripts/monitoring/wedge_telemetry.py:/app/wedge_telemetry.py:ro
      - ./../../../_iteration_log:/out
    depends_on:
      vllm-medium-qwen36-moe:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vllm-compile-cache-qwen36-genesis-tq:  # separate from baseline + dflash caches

