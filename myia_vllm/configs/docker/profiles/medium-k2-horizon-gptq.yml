# Docker Compose profile - K2-Horizon-MoVA-36B-A4B GPTQ INT4 (eval)
# ============================================================================
# EVAL PROFILE (2026-09-22, fork-approach arbitrated OK by user) — K2-Horizon
# 36B-A4B MoE (MoVA attention, 512K native) vs prod Qwen3.6-35B-A3B.
# Quality case (IFM card): Terminal-Bench 2.1 58.6 vs 32.6, tau3-Banking 26.8
# vs 22.1, HLE 25.2 vs 17.5 — frontier-agentic tier at 4B active.
#
# IMAGE: overlay vllm-openai-v0300-s56637:v1 = stock v0.30.0 + vLLM PR #56637
# ("[Model] Fix K2-Horizon MoVA weight loading and support GPTQ INT4", 2 files,
# +230/-54; runtime file k2_horizon.py only — file unchanged between PR base
# 7ee8a6dd and v0.30.0, verified via compare API, clean file-for-file replace).
# Overlay dir: myia_vllm/configs/docker/overlay_v0300_s56637/.
#
# TARGET QUANTS (both GPTQ, both served by the same overlay):
#   v1  urakozz AutoRound W4A16 GS-64 (DEFAULT) — code-calibrated (OpenCodeInstruct)
#   v2  Siladrim GPTQModel GS-128 — C4+de+code, verified multilingual, most downloaded
#   Variant: VLLM_MODEL_K2=Siladrim/K2-Horizon-MoVA-36B-A4B-GPTQ-Int4
# Third option NOT wired here: cyankiwi AWQ-INT4 (compressed-tensors) needs the
# cyankiwi vLLM fork (base d2906091) — user-sanctioned fallback if GPTQ path fails.
#
# NOTABLE DIFFS vs Qwen profiles:
#   - K2 is TEXT-ONLY (no mm flags), GQA+MoVA (NO GDN/mamba: --gdn-prefill-backend,
#     --mamba-ssm-cache-dtype, --prefix-match-unit all REMOVED — mamba-only flags)
#   - --trust-remote-code MANDATORY (custom_code arch K2HorizonForCausalLM)
#   - --quantization gptq explicit (urakozz card)
#   - parsers k2_horizon (upstream in v0.30.0, per IFM recipe)
#   - sampling per IFM card: temp 1.0 / top_p 0.95 / reasoning_effort high
#   - HF cache = JESSE's (quants + BF16 snapshot live there, NOT in the user
#     cache the prod profile mounts) — bind hardcoded below, do NOT substitute
#     ${HF_CACHE_PATH} here.
#
# ⚠ OPERATOR TRAPS (from today's windows, all live incidents):
#   - EVERY compose command carries --env-file myia_vllm/.env.
#   - NEVER '#' comment lines inside the backslash-continued command block.
#     Verify with `docker compose config` before every `up`.
#   - Stop the watchdog before the battery (prefill gates starve its probe).
#
# RUNBOOK (window ~90-120 min):
#   BASELINE (A legs) on LIVE prod first. SWAP down/up with --env-file.
#   BOOT: fresh compile-cache -> 10-25 min normal (start_period 1800s).
#   GATES: battery vs port 5002 (served-model-name k2-horizon-36b-a4b) +
#     QUALITY CANARY (fixed French prompt, assert sane reasoning <ifm|think>).
#   FALLBACKS: boot KV-check fail under fp8 -> KV_DTYPE_K2=auto (+ cap len);
#     EP rejected with fused v_experts -> drop --enable-expert-parallel.
#   END: restore prod stack, verify health+KV, report.
# ============================================================================

services:
  vllm-medium-k2-horizon:  # eval stack — the 3.6 prod stack must be DOWN first
    image: vllm-openai-v0300-s56637:v1
    container_name: myia_vllm-medium-k2-horizon
    # gpu-memory-utilization 0.70 (boot-OOM history; ~11 GiB weights/GPU at TP=2
    # for these quants; do not tune gpu-util in the same change that swaps model)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ok=0; big=0
        for i in $$(seq 1 36); do
          big=$$(find /root/.cache/huggingface -type f -size +4G -printf '%s\n' 2>/dev/null | sort -rn | head -1); big=$${big:-0}
          if [ "$$big" -gt 4000000000 ]; then ok=1; break; fi
          echo "[hf-mount-guard] largest blob $$big bytes (<4G), waiting for WSL HF bind ($$i/36)..."; sleep 5
        done
        if [ "$$ok" != 1 ]; then
          echo "HF-CACHE-PHANTOM-MOUNT: no >4G blob after 3 min (largest=$$big). Refusing to start. Fix: 'wsl -l -v' (Ubuntu must be Running), then: docker compose -f <this-profile> down && up -d"
          exit 1
        fi
        exec vllm serve \
          --host 0.0.0.0 \
          --port ${VLLM_PORT_GLM:-5002} \
          --model ${VLLM_MODEL_K2:-urakozz/IFM-K2-Horizon-MoVA-36B-A4B-W4A16-AutoRound-GPTQ} \
          --served-model-name k2-horizon-36b-a4b \
          --api-key ${VLLM_API_KEY_MEDIUM} \
          --tensor-parallel-size 2 \
          --enable-expert-parallel \
          --trust-remote-code \
          --quantization gptq \
          --no-enable-flashinfer-autotune \
          --gpu-memory-utilization 0.70 \
          --max-model-len 131072 \
          --kv-cache-dtype ${KV_DTYPE_K2:-fp8} \
          --dtype bfloat16 \
          --max-num-batched-tokens 8192 \
          --max-num-seqs 16 \
          --performance-mode interactivity \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --prefix-caching-hash-algo sha256 \
          --enable-auto-tool-choice \
          --tool-call-parser k2_horizon \
          --reasoning-parser k2_horizon \
          --distributed-executor-backend mp \
          --disable-custom-all-reduce \
          --async-scheduling \
          --no-scheduler-reserve-full-isl \
          --override-generation-config '{"temperature":1.0,"top_p":0.95,"min_p":0.0,"repetition_penalty":1.0}' \
          --middleware error_source_capture.ErrorSourceCapture
    labels:
      - "autoheal=False"
    ipc: host
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0,1
      - CUDA_VISIBLE_DEVICES=0,1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - VLLM_USE_DEEP_GEMM=0
      - OMP_NUM_THREADS=1
      - VLLM_LOG_DIR=/logs
      - PYTHONPATH=/middleware
      - VLLM_MAX_REQUEST_BODY_BYTES=0
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - NCCL_P2P_DISABLE=1
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
    volumes:
      - ${VLLM_MODELS_PATH:-./models}:/models:ro
      - type: bind
        source: \\wsl.localhost\Ubuntu\home\jesse\.cache\huggingface
        target: /root/.cache/huggingface
        bind:
          create_host_path: false
      - vllm-compile-cache-k2-horizon-v0300-s56637:/root/.cache/vllm
      - ${VLLM_LOG_PATH:-./../../../logs}:/logs
      - ./../../../middleware:/middleware:ro
    ports:
      - "${VLLM_PORT_GLM:-5002}:${VLLM_PORT_GLM:-5002}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT_GLM:-5002}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s
    restart: unless-stopped

  # Watchdog v5 — same logic as prod; probe body has NO Qwen chat_template_kwargs
  # (K2 template takes reasoning_effort; unknown kwargs may template-error).
  watchdog-k2-horizon:
    image: docker:cli
    container_name: myia_vllm-watchdog-k2-horizon
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1

        CONTAINER="myia_vllm-medium-k2-horizon"
        PORT="$${VLLM_PORT_GLM:-5002}"
        INTERVAL=30
        HEALTH_TIMEOUT=5
        GEN_TIMEOUT=40
        PROBE_MAX_TOKENS=24
        GEN_TIMEOUT_WARM=120
        WARMUP_PROBES=3
        WARMUP_LEFT=$$WARMUP_PROBES
        WEDGE_MAX=2
        UNHEALTHY_MAX=4
        DOWN_MAX=24
        WEDGE_FAIL=0
        DOWN_FAIL=0
        STARTING_MAX=3
        PREV_RC=-1
        STARTING_CHURN=0
        STALL_MAX=24
        STARTING_CYCLES=0

        echo "Watchdog v5 for K2-Horizon eval (wedge + hard-hang + crash-loop + boot-stall)"

        while true; do
          TS=$$(date '+%Y-%m-%d %H:%M:%S')

          H=$$(curl -s -o /dev/null -w "%{http_code}" --max-time $$HEALTH_TIMEOUT \
            "http://host.docker.internal:$$PORT/health" 2>/dev/null)

          if [ "$$H" = "200" ]; then
            if [ $$WARMUP_LEFT -gt 0 ]; then GT=$$GEN_TIMEOUT_WARM; else GT=$$GEN_TIMEOUT; fi
            G=$$(curl -s -o /dev/null -w "%{http_code}" --max-time $$GT \
              -X POST "http://host.docker.internal:$$PORT/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $${VLLM_API_KEY_MEDIUM}" \
              -d '{"model":"k2-horizon-36b-a4b","messages":[{"role":"user","content":"Count to twenty."}],"max_tokens":'$$PROBE_MAX_TOKENS',"temperature":0}' 2>/dev/null)
            DOWN_FAIL=0
            STARTING_CHURN=0; PREV_RC=-1
            STARTING_CYCLES=0
            if [ "$$G" = "200" ]; then
              if [ $$WEDGE_FAIL -gt 0 ]; then
                echo "$$TS RECOVERED (decode ok after $$WEDGE_FAIL wedge fails)"
              elif [ $$WARMUP_LEFT -gt 0 ]; then
                echo "$$TS OK health=200 decode=200 (warm-up grace consumed — engine is warm)"
              else
                echo "$$TS OK health=200 decode=200"
              fi
              WEDGE_FAIL=0
              WARMUP_LEFT=0
            elif [ $$WARMUP_LEFT -gt 0 ]; then
              WARMUP_LEFT=$$((WARMUP_LEFT - 1))
              echo "$$TS WARMUP health=200 decode=$$G — post-boot grace, $$WARMUP_LEFT probe(s) left, NOT counted as wedge"
            else
              WEDGE_FAIL=$$((WEDGE_FAIL + 1))
              echo "$$TS WEDGE health=200 decode=$$G (fail $$WEDGE_FAIL/$$WEDGE_MAX)"
              if [ $$WEDGE_FAIL -ge $$WEDGE_MAX ]; then
                echo "$$TS RESTARTING $$CONTAINER (WEDGE: API up but decode stuck)"
                docker restart $$CONTAINER
                WEDGE_FAIL=0
                WARMUP_LEFT=$$WARMUP_PROBES
                echo "$$TS Restart issued. Waiting 600s for boot..."
                sleep 600
                continue
              fi
            fi
          else
            HS=$$(docker inspect --format '{{.State.Health.Status}}' $$CONTAINER 2>/dev/null)
            WEDGE_FAIL=0
            if [ "$$HS" = "starting" ]; then
              DOWN_FAIL=0
              STARTING_CYCLES=$$((STARTING_CYCLES + 1))
              WARMUP_LEFT=$$WARMUP_PROBES
              RC=$$(docker inspect --format '{{.RestartCount}}' $$CONTAINER 2>/dev/null)
              RC=$${RC:-0}
              if [ "$$PREV_RC" -ge 0 ] && [ "$$RC" -gt "$$PREV_RC" ]; then
                STARTING_CHURN=$$((STARTING_CHURN + 1))
              fi
              PREV_RC=$$RC
              if [ $$STARTING_CHURN -ge $$STARTING_MAX ]; then
                OOMHITS=$$(docker logs --since 10m $$CONTAINER 2>&1 | grep -ci "out of memory")
                if [ "$${OOMHITS:-0}" -gt 0 ]; then
                  echo "$$TS CRASH-LOOP $$CONTAINER docker=starting, RestartCount churning (=$$RC, +$$STARTING_CHURN), CUDA-OOM present in log ($$OOMHITS hits). NOT auto-restarting."
                else
                  echo "$$TS CRASH-LOOP $$CONTAINER docker=starting, RestartCount churning (=$$RC, +$$STARTING_CHURN), NO OOM in log — cause UNKNOWN. Read: docker logs $$CONTAINER. NOT auto-restarting."
                fi
              elif [ $$STARTING_CYCLES -ge $$STALL_MAX ]; then
                LOADING=$$(docker logs --since 20m $$CONTAINER 2>&1 | grep -c "Starting to load model")
                LOADED=$$(docker logs --since 20m $$CONTAINER 2>&1 | grep -c "Model loading took")
                MINS=$$((STARTING_CYCLES * INTERVAL / 60))
                if [ "$${LOADING:-0}" -gt 0 ] && [ "$${LOADED:-0}" -eq 0 ]; then
                  echo "$$TS BOOT-STALL $$CONTAINER stuck LOADING WEIGHTS for $${MINS} min, RestartCount FLAT (=$$RC). Prime suspect: HF-cache bind resolved EMPTY (phantom). CHECK: docker exec $$CONTAINER du -sh /root/.cache/huggingface/hub -> must show the ~22G quant. If empty/missing: confirm 'wsl -l -v' shows Ubuntu Running, then compose down && up -d. NOT auto-restarting."
                else
                  echo "$$TS BOOT-STALL $$CONTAINER docker=starting for $${MINS} min, RestartCount FLAT (=$$RC), weights loaded — stalled AFTER load. Read: docker logs $$CONTAINER. NOT auto-restarting."
                fi
              else
                echo "$$TS BOOTING health=$$H (docker=starting, within 30-min grace; RestartCount=$$RC, cycle $$STARTING_CYCLES/$$STALL_MAX)"
              fi
              sleep $$INTERVAL
              continue
            fi
            STARTING_CYCLES=0
            HI=$$(curl -s -o /dev/null -w "%{http_code}" --max-time $$HEALTH_TIMEOUT \
              "http://vllm-medium-k2-horizon:$$PORT/health" 2>/dev/null)
            DOWN_FAIL=$$((DOWN_FAIL + 1))
            if [ "$$HI" = "200" ]; then
              THRESH=$$DOWN_MAX
              echo "$$TS PORT-FWD-LOSS host=$$H internal=200 docker=$$HS (fail $$DOWN_FAIL/$$THRESH)"
            elif [ "$$HS" = "unhealthy" ]; then
              THRESH=$$UNHEALTHY_MAX
              echo "$$TS ENGINE-HUNG host=$$H internal=$$HI docker=unhealthy (fail $$DOWN_FAIL/$$THRESH, ~2min fast-path)"
            else
              THRESH=$$DOWN_MAX
              echo "$$TS ENGINE-DOWN host=$$H internal=$$HI docker=$$HS (fail $$DOWN_FAIL/$$THRESH)"
            fi
            if [ $$DOWN_FAIL -ge $$THRESH ]; then
              echo "$$TS RESTARTING $$CONTAINER (unresponsive $$DOWN_FAIL cycles, docker=$$HS)"
              docker restart $$CONTAINER
              DOWN_FAIL=0
              WARMUP_LEFT=$$WARMUP_PROBES
              echo "$$TS Restart issued. Waiting 600s for boot..."
              sleep 600
              continue
            fi
          fi

          sleep $$INTERVAL
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VLLM_API_KEY_MEDIUM=${VLLM_API_KEY_MEDIUM}
      - VLLM_PORT_GLM=${VLLM_PORT_GLM:-5002}
    depends_on:
      vllm-medium-k2-horizon:
        condition: service_healthy
    restart: unless-stopped

  # Wedge-telemetry sidecar — same as prod, pointed at the eval service.
  wedge-telemetry:
    image: python:3-slim
    container_name: myia_vllm-wedge-telemetry-k2
    command: ["python", "/app/wedge_telemetry.py", "--interval", "60", "--out", "/out/wedge_telemetry.jsonl"]
    environment:
      - WEDGE_METRICS_URL=http://vllm-medium-k2-horizon:${VLLM_PORT_GLM:-5002}/metrics
    volumes:
      - ./../../../scripts/monitoring/wedge_telemetry.py:/app/wedge_telemetry.py:ro
      - ./../../../_iteration_log:/out
    depends_on:
      vllm-medium-k2-horizon:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vllm-compile-cache-k2-horizon-v0300-s56637:
