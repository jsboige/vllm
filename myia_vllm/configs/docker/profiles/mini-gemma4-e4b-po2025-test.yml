# ============================================================================
# GO user 23/10 : « bascule sur l'image latest pour faire des tests avec le
# nouveau modèle 4B ».
#
# ENQUÊTE D'IDENTIFICATION (23/10, tout VERIFIÉ) :
#   - `vllm/vllm-openai:latest` == v0.32.0 (digest manifest befccf0e…, poussé 18/10,
#     comparé au tag v0.32.0 : identique) — l'image FrogNano en prod EST déjà
#     « latest ». Aucune release vLLM plus récente n'existe.
#   - Aucun FrogNano nouveau : microsoft/FrogNano-4B-2609 inchangé (commits =
#     README seul, poids du 17/09) ; aucun « 2610 » nulle part.
#   - Lignée « heretic » (richardyoung/saidutta69, mi-oct) = ABLITERATION
#     (décensurage Heretic v1.4/v2.0, KL 0.0046-0.0395, refus 99→12/100) — ÉCARTÉE :
